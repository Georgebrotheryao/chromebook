<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#202124;color:#e8eaed;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:6px;height:44px;padding:0 8px;background:#35363a;flex:none}
  .bar button{height:30px;padding:0 12px;border:0;border-radius:15px;background:#3c4043;color:#e8eaed;font:inherit;font-size:13px;cursor:pointer}
  .bar button:hover:not(:disabled){background:#4a4d51}
  .bar button:disabled{opacity:.4;cursor:default}
  .bar .sp{flex:1}
  #info{font-size:12px;color:#9aa0a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #stage{position:relative;flex:1;min-height:0;background:#000}
  #screen{position:absolute;inset:0}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.82);text-align:center;padding:24px;z-index:2}
  #overlay.hide{display:none}
  #overlay p{margin:0;font-size:15px;max-width:460px;line-height:1.45}
  #overlay button{height:38px;padding:0 22px;border:0;border-radius:19px;background:#8ab4f8;color:#202124;font:inherit;font-weight:600;cursor:pointer}
  #overlay button.hide{display:none}
  .spin{width:30px;height:30px;border:3px solid #5f6368;border-top-color:#8ab4f8;border-radius:50%;animation:sp .8s linear infinite}
  .spin.hide{display:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  .admin.hide{display:none}
</style>
</head>
<body>
<div class="bar">
  <button id="back" disabled title="Android Back (Esc)">&#9664; Back</button>
  <button id="home" disabled title="Android Home (Windows key)">&#9679; Home</button>
  <button id="recent" disabled title="Android Recents (Menu key)">&#9632; Recents</button>
  <button id="full" disabled>Fullscreen</button>
  <span class="sp"></span>
  <span id="info"></span>
  <button id="inst" class="admin hide" title="Tells the server to boot from the virtual disk instead of the installer">Installation finished</button>
  <button id="stop" class="admin hide">Power off</button>
</div>
<div id="stage">
  <div id="screen"></div>
  <div id="overlay"><div class="spin"></div><p id="msg">Checking...</p><button id="go" class="hide">Start Android</button></div>
</div>

<script type="module">
import RFB from '/mobile/novnc/core/rfb.js';

const $ = s => document.querySelector(s);
const overlay = $('#overlay'), msg = $('#msg'), go = $('#go'), spin = $('.spin');
let rfb = null, wantConnect = false, timer = null;

function show(text, opts) {
  opts = opts || {};
  overlay.classList.remove('hide');
  msg.textContent = text;
  spin.classList.toggle('hide', !opts.spin);
  go.classList.toggle('hide', !opts.button);
  go.textContent = opts.button || '';
}

async function post(url) { try { return await (await fetch(url, { method: 'POST' })).json(); } catch (e) { return null; } }

function connect() {
  if (rfb) return;
  show('Starting the virtual phone...', { spin: true });
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  rfb = new RFB($('#screen'), proto + '://' + location.host + '/mobile/ws');
  rfb.scaleViewport = true;
  rfb.resizeSession = false;
  rfb.focusOnClick = true;
  rfb.addEventListener('connect', () => {
    overlay.classList.add('hide');
    for (const b of ['#back', '#home', '#recent', '#full']) $(b).disabled = false;
    $('#info').textContent = 'Software emulation: booting and taps can take a long time.';
    rfb.focus();
  });
  rfb.addEventListener('disconnect', e => {
    rfb = null;
    for (const b of ['#back', '#home', '#recent', '#full']) $(b).disabled = true;
    wantConnect = false;
    show(e.detail.clean ? 'The session ended.' : 'Could not connect to the phone. It may be full (2 viewers max), still starting, or out of memory.', { button: 'Try again' });
  });
}

async function poll() {
  clearTimeout(timer);
  let s = null;
  try {
    const r = await fetch('/mobile/status');
    if (r.status === 401) { location.href = '/login?next=%2Fmobile'; return; }
    s = await r.json();
  } catch (e) {}
  if (s) {
    $('.admin#inst').classList.toggle('hide', !s.admin);
    $('.admin#stop').classList.toggle('hide', !s.admin);
    $('#inst').textContent = s.installed ? 'Boot from installer again' : 'Installation finished';
    if (!rfb) {
      if (s.state === 'off' || s.state === 'on') {
        const note = s.mode === 'installer' ? ' The first boot runs the Android installer: install to the virtual disk, then an admin presses "Installation finished".' : '';
        if (wantConnect) connect();
        else show((s.state === 'on' ? 'The phone is running.' : 'The phone is off.') + ' Booting under software emulation can take 10-20 minutes.' + note, { button: s.state === 'on' ? 'Open' : 'Start Android' });
      } else if (s.state === 'needs-download') {
        show('The Android image has not been downloaded yet.', { button: 'Download image' });
      } else if (s.state === 'downloading') {
        show(s.message, { spin: true });
      } else {
        show(s.message || 'Not available.');
      }
    }
  } else if (!rfb) show('Cannot reach the server.');
  timer = setTimeout(poll, 3000);
}

go.addEventListener('click', async () => {
  const s = await post('/mobile/start');
  if (s && s.state === 'downloading') return poll();
  wantConnect = true;
  poll();
});

// Android-x86 key mapping: Esc = Back, Windows key = Home, Menu = Recents
const KEYS = { '#back': ['Escape', 0xFF1B], '#home': ['MetaLeft', 0xFFEB], '#recent': ['ContextMenu', 0xFF67] };
for (const id in KEYS) {
  $(id).addEventListener('click', () => { if (rfb) { rfb.sendKey(KEYS[id][1], KEYS[id][0]); rfb.focus(); } });
}
$('#full').addEventListener('click', () => { const el = $('#stage'); (document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen()).catch(() => {}); });
$('#inst').addEventListener('click', async () => { await post('/mobile/installed'); poll(); });
$('#stop').addEventListener('click', async () => { if (confirm('Power off the Android guest?')) { await post('/mobile/stop'); } });

poll();
</script>
</body>
</html>
