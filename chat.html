<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocalChat</title>
<style>
[hidden]{display:none !important}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0d12;color:#e7e9f0;font-family:"Google Sans",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;justify-content:center;padding:12px}
.app{position:relative;width:min(760px,100%);height:100%;display:flex;flex-direction:column;background:#0f1117;border:1px solid #232734;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:popIn .3s cubic-bezier(.16,1,.3,1)}
@keyframes popIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#131722;border-bottom:1px solid #1f2330;flex-wrap:wrap}
.title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;margin-right:auto}
.logo{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#7c8cff,#3ddc97)}
.me{font-size:12px;color:#b9c3dc}
.online{font-size:12px;color:#8a93a8;white-space:nowrap}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:#9aa3b8;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#5b6378}
.status.busy .dot{background:#f5b942;animation:pulse 1.2s infinite}
.status.ok .dot{background:#3ddc97;box-shadow:0 0 8px #3ddc97}
.status.error .dot{background:#ff5d6c}
@keyframes pulse{50%{opacity:.3}}
.error{margin:10px 14px 0;padding:9px 12px;border-radius:10px;background:rgba(255,93,108,.12);border:1px solid rgba(255,93,108,.35);color:#ff9aa4;font-size:13px}
.messages{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.row{display:flex}
.row.me{justify-content:flex-end}
.bubble{max-width:78%;padding:8px 12px;border-radius:16px;background:#1c2130;animation:bubbleIn .25s cubic-bezier(.16,1,.3,1)}
@keyframes bubbleIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.row.me .bubble{background:linear-gradient(135deg,#6f7fff,#5366ef);color:#fff;border-bottom-right-radius:5px}
.row.other .bubble{border-bottom-left-radius:5px}
.meta{font-size:11px;opacity:.7;margin-bottom:2px}
.text{font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.del-btn{display:block;margin:6px 0 0 auto;padding:2px 10px;font-size:11px;border-radius:10px;background:rgba(255,255,255,.18);border:0;color:#fff;cursor:pointer}
.del-btn:hover{background:rgba(255,255,255,.32)}
.gamecard{display:flex;flex-direction:column;gap:6px;min-width:200px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);margin-top:2px}
.gc-title{font-size:13px}
.gc-game{font-size:15px;font-weight:600}
.gc-play{align-self:flex-start;height:30px;padding:0 14px;font-size:12px;margin-top:2px}
.system{align-self:center;font-size:12px;color:#7d869b;background:#171b26;padding:4px 10px;border-radius:10px}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid #1f2330;background:#131722}
textarea{flex:1;resize:none;max-height:140px;min-height:40px;border-radius:20px;border:1px solid #2a3040;background:#0c0f16;color:#e7e9f0;padding:10px 14px;font:inherit;font-size:14px;outline:none;line-height:1.4}
textarea:focus{border-color:#7c8cff}
button{height:38px;padding:0 16px;border-radius:19px;border:1px solid #2a3040;background:#1c2130;color:#e7e9f0;font:inherit;font-size:13px;cursor:pointer;transition:transform .12s,background .15s}
button:hover{background:#262c3d}
button:active{transform:scale(.96)}
button.primary{background:linear-gradient(135deg,#7c8cff,#5a6df0);border-color:transparent;color:#fff}
button.ghost{background:transparent}
footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px 12px;background:#131722;font-size:12px;color:#8a93a8}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.panel{width:min(400px,100%);max-height:100%;display:flex;flex-direction:column;background:#131722;border:1px solid #232734;border-radius:16px;overflow:hidden;animation:popIn .25s cubic-bezier(.16,1,.3,1)}
.panel-head{padding:14px 16px;font-weight:600;border-bottom:1px solid #1f2330}
.panel-note{padding:8px 16px 0;font-size:12px;color:#8a93a8}
.people{flex:1;min-height:0;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.person{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:#0c0f16;cursor:pointer;font-size:14px}
.person:hover{background:#171b26}
.person input{width:16px;height:16px;accent-color:#7c8cff;cursor:pointer}
.pdot{width:8px;height:8px;border-radius:50%;background:#4b5263;flex:none}
.pdot.on{background:#3ddc97;box-shadow:0 0 6px #3ddc97}
.person .pname{flex:1}
.person .plabel{font-size:11px;color:#6b7389}
.panel-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px;border-top:1px solid #1f2330}
.empty{color:#6b7389;font-size:13px;padding:10px 4px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title"><span class="logo"></span>LocalChat</div>
    <span class="me" id="me"></span>
    <span class="online" id="online"></span>
    <button id="playBtn">Play</button>
    <button id="inviteBtn">Invite</button>
    <button class="ghost" id="signout">Sign out</button>
    <div class="status busy" id="status"><span class="dot"></span><span id="statusText">Connecting…</span></div>
  </header>
  <div class="error" id="error" hidden></div>
  <div class="messages" id="messages"></div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Message (Enter to send, Shift+Enter for a new line)"></textarea>
    <button class="primary" id="send">Send</button>
  </div>
  <footer>
    <button class="ghost" id="clear">Clear view</button>
    <span>Everyone who signs in sees these messages.</span>
  </footer>

  <div class="overlay" id="invitePanel" hidden>
    <div class="panel">
      <div class="panel-head">Invite people to the chat</div>
      <div class="panel-note" id="inviteNote">Choose who to invite. They get a notification in the Chromebook.</div>
      <div class="people" id="people"></div>
      <div class="panel-foot">
        <button class="ghost" id="inviteCancel">Cancel</button>
        <button class="primary" id="inviteSend">Send invite</button>
      </div>
    </div>
  </div>
  <div class="overlay" id="gamePanel" hidden>
    <div class="panel">
      <div class="panel-head">Play a game together</div>
      <div class="panel-note" id="gameNote">Pick a game and the people to play with. They get an invite.</div>
      <div style="padding:10px 16px 0"><select id="gameSelect" style="width:100%;height:38px;border-radius:12px;border:1px solid #2a3040;background:#0c0f16;color:#e7e9f0;padding:0 10px;font:inherit"></select></div>
      <div class="people" id="gamePeople"></div>
      <div class="panel-foot">
        <button class="ghost" id="gameCancel">Cancel</button>
        <button class="primary" id="gameStart">Create game and invite</button>
      </div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const seen = new Set();
let ME = null;
let es = null;

function setStatus(kind, text) {
  $('#status').className = 'status ' + kind;
  $('#statusText').textContent = text;
}
function showError(msg) {
  const e = $('#error');
  e.textContent = msg;
  e.hidden = !msg;
}
function setOnline(n) { $('#online').textContent = n + ' online'; }
function fmtClock(ts) { return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
function scrollDown() { const m = $('#messages'); m.scrollTop = m.scrollHeight; }

async function api(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  return r.json().catch(() => ({ ok: false, error: 'Unexpected response from the server' }));
}

function gameCard(roomId, senderName, mine) {
  const card = document.createElement('div');
  card.className = 'gamecard';
  const title = document.createElement('div');
  title.className = 'gc-title';
  title.textContent = mine ? 'You invited people to play' : senderName + ' invited you to play';
  const game = document.createElement('div');
  game.className = 'gc-game';
  game.textContent = 'a game';
  const play = document.createElement('button');
  play.className = 'primary gc-play';
  play.textContent = 'Play';
  play.addEventListener('click', () => window.open('/games?room=' + encodeURIComponent(roomId), '_blank'));
  card.append(title, game, play);
  fetch('/games/info?room=' + encodeURIComponent(roomId))
    .then(r => r.json())
    .then(d => {
      if (d.ok) game.textContent = d.game + (d.started ? ' (in progress)' : d.full ? ' (full)' : '');
      else { game.textContent = 'This game is closed'; play.disabled = true; }
    })
    .catch(() => {});
  return card;
}

function removeMessage(id) {
  document.querySelectorAll('.row[data-id="' + id + '"]').forEach(el => el.remove());
}

function addMessage(m) {
  if (seen.has(m.id)) return;
  seen.add(m.id);
  const mine = m.uid === ME.id;
  const row = document.createElement('div');
  row.className = 'row ' + (mine ? 'me' : 'other');
  row.dataset.id = m.id;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = (mine ? 'You' : m.name) + ' · ' + fmtClock(m.ts);
  const text = document.createElement('div');
  text.className = 'text';
  // A game room link becomes a Play card
  const gameLink = String(m.text).match(/games\?room=([0-9a-f]{6,16})/);
  if (gameLink) {
    const rest = String(m.text).replace(/https?:\/\/\S*games\?room=\S*/, '').replace(/\S*games\?room=\S*/, '').trim();
    if (rest) text.textContent = rest;
    else text.remove();
    bubble.append(meta);
    if (rest) bubble.append(text);
    bubble.append(gameCard(gameLink[1], m.name, m.uid === ME.id));
  } else {
    text.textContent = m.text;
    bubble.append(meta, text);
  }
  if (mine) {
    const del = document.createElement('button');
    del.className = 'del-btn';
    del.textContent = 'Delete';
    del.addEventListener('click', () => deleteMessage(m.id));
    bubble.append(del);
  }
  row.append(bubble);
  $('#messages').append(row);
  scrollDown();
}

async function deleteMessage(id) {
  const d = await api('/delete', { id: id });
  if (!d.ok) return showError(d.error || 'Could not delete the message.');
  removeMessage(id);
  showError('');
}

function connect() {
  es = new EventSource('/events');
  es.addEventListener('hello', e => {
    const d = JSON.parse(e.data);
    setStatus('ok', 'Connected');
    showError('');
    setOnline(d.online);
    d.history.forEach(addMessage);
  });
  es.addEventListener('message', e => addMessage(JSON.parse(e.data)));
  es.addEventListener('delete', e => removeMessage(JSON.parse(e.data).id));
  es.addEventListener('online', e => setOnline(JSON.parse(e.data).online));
  es.onerror = () => setStatus('error', 'Reconnecting…');
}

async function sendMessage() {
  const input = $('#input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  autosize();
  try {
    const d = await api('/send', { text: text });
    if (!d.ok) throw new Error(d.error || 'Could not send the message.');
    showError('');
  } catch (err) {
    input.value = text;
    autosize();
    showError(err instanceof TypeError ? 'Could not reach the server. Check your connection.' : err.message);
  }
}

function autosize() {
  const t = $('#input');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 140) + 'px';
}

// ----- Invites -----
async function openInvite() {
  showError('');
  $('#people').innerHTML = '';
  $('#inviteNote').textContent = 'Choose who to invite. They get a notification in the Chromebook.';
  $('#invitePanel').hidden = false;
  const d = await api('/api/users').catch(() => null);
  const list = d && d.users ? d.users : [];
  if (!list.length) {
    $('#people').innerHTML = '<div class="empty">No other accounts yet.</div>';
    return;
  }
  list.forEach(u => {
    const label = document.createElement('label');
    label.className = 'person';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = u.id;
    const dot = document.createElement('span');
    dot.className = 'pdot' + (u.online ? ' on' : '');
    const name = document.createElement('span');
    name.className = 'pname';
    name.textContent = u.name;
    const state = document.createElement('span');
    state.className = 'plabel';
    state.textContent = u.online ? 'online' : 'offline';
    label.append(cb, dot, name, state);
    $('#people').append(label);
  });
}

async function sendInvites() {
  const ids = [...document.querySelectorAll('#people input:checked')].map(cb => cb.value);
  if (!ids.length) return ($('#inviteNote').textContent = 'Pick at least one person.');
  const d = await api('/api/invite', { kind: 'chat', to: ids });
  if (!d.ok) return ($('#inviteNote').textContent = d.error || 'Could not send the invite.');
  $('#inviteNote').textContent = 'Invite sent to ' + ids.length + ' ' + (ids.length === 1 ? 'person' : 'people') + '.';
  setTimeout(() => { $('#invitePanel').hidden = true; }, 900);
}

// ----- Start -----
async function init() {
  let d;
  try {
    d = await (await fetch('/api/me')).json();
  } catch (e) {
    setStatus('error', 'Offline');
    showError('Could not reach the server. Check your connection.');
    return;
  }
  if (!d.user) {
    location.href = '/login?next=' + encodeURIComponent('/chat');
    return;
  }
  ME = d.user;
  $('#me').textContent = 'Signed in as ' + ME.name;
  connect();
  $('#input').focus();
}

$('#send').addEventListener('click', sendMessage);
$('#input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
});
$('#input').addEventListener('input', autosize);
$('#clear').addEventListener('click', () => { $('#messages').innerHTML = ''; });
const GAME_OPTIONS = [
  ['tictactoe', 'Tic-Tac-Toe'], ['connect4', 'Connect Four'], ['rps', 'Rock Paper Scissors'],
  ['reaction', 'Reaction Race'], ['scramble', 'Word Scramble'], ['quickmath', 'Quick Math'],
  ['hangman', 'Hangman (team)'], ['simon', 'Simon Says'], ['doodle', 'Shared Doodle'], ['tapbattle', 'Tap Battle']
];
async function openGamePanel() {
  $('#gameNote').textContent = 'Pick a game and the people to play with. They get an invite.';
  const sel = $('#gameSelect');
  if (!sel.options.length) GAME_OPTIONS.forEach(([v, t]) => sel.add(new Option(t, v)));
  const box = $('#gamePeople');
  box.innerHTML = '';
  $('#gamePanel').hidden = false;
  const d = await api('/api/users').catch(() => null);
  (d && d.users ? d.users : []).forEach(u => {
    const label = document.createElement('label');
    label.className = 'person';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = u.id;
    const dot = document.createElement('span');
    dot.className = 'pdot' + (u.online ? ' on' : '');
    const name = document.createElement('span');
    name.className = 'pname';
    name.textContent = u.name;
    label.append(cb, dot, name);
    box.append(label);
  });
}
async function startGame() {
  const game = $('#gameSelect').value;
  const ids = [...document.querySelectorAll('#gamePeople input:checked')].map(cb => cb.value);
  const created = await api('/games/create', { game: game });
  if (!created.ok) return ($('#gameNote').textContent = created.error || 'Could not create the game.');
  if (ids.length) await api('/api/invite', { kind: 'game', room: created.room, to: ids });
  window.open('/games?room=' + encodeURIComponent(created.room), '_blank');
  $('#gamePanel').hidden = true;
}
$('#playBtn').addEventListener('click', openGamePanel);
$('#gameCancel').addEventListener('click', () => { $('#gamePanel').hidden = true; });
$('#gameStart').addEventListener('click', startGame);
$('#inviteBtn').addEventListener('click', openInvite);
$('#inviteCancel').addEventListener('click', () => { $('#invitePanel').hidden = true; });
$('#inviteSend').addEventListener('click', sendInvites);
$('#signout').addEventListener('click', async () => {
  if (es) es.close();
  await fetch('/api/logout', { method: 'POST' });
  location.href = '/login?next=' + encodeURIComponent('/chat');
});

init();
</script>
</body>
</html>
