<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video call</title>
<style>
[hidden]{display:none !important}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0d12;color:#e7e9f0;font-family:"Google Sans",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{height:100%;display:flex;flex-direction:column;min-height:0}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#131722;border-bottom:1px solid #1f2330}
.title{font-weight:600;margin-right:auto}
.count{font-size:12px;color:#8a93a8}
.status{font-size:12px;color:#9aa3b8}
.error{margin:10px 14px 0;padding:9px 12px;border-radius:10px;background:rgba(255,93,108,.12);border:1px solid rgba(255,93,108,.35);color:#ff9aa4;font-size:13px;line-height:1.4}
.lobby{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.lobby h2{font-size:18px}
.lobby p{color:#8a93a8;font-size:13px;max-width:400px;line-height:1.5}
input{height:40px;width:min(280px,90%);border-radius:20px;border:1px solid #2a3040;background:#0c0f16;color:#e7e9f0;padding:0 14px;font:inherit;font-size:14px;outline:none}
input:focus{border-color:#7c8cff}
button{height:40px;padding:0 18px;border-radius:20px;border:1px solid #2a3040;background:#1c2130;color:#e7e9f0;font:inherit;font-size:13px;cursor:pointer;transition:transform .12s,background .15s}
button:hover{background:#262c3d}
button:active{transform:scale(.96)}
button.primary{background:linear-gradient(135deg,#7c8cff,#5a6df0);border-color:transparent;color:#fff}
button.danger{background:#5b2630;border-color:#7a3340;color:#ffb4bd}
button.off{background:#5b2630;border-color:#7a3340;color:#ffb4bd}
.call{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.grid{flex:1;min-height:0;overflow:auto;display:grid;gap:10px;padding:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));align-content:center}
.tile{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3;border:1px solid #1f2330;animation:tileIn .35s cubic-bezier(.16,1,.3,1)}
@keyframes tileIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile.self video{transform:scaleX(-1)}
.tile .avatar{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:44px;color:#7d869b;background:#111520}
.tile.camoff .avatar{display:flex}
.tile.camoff video{visibility:hidden}
.label{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);padding:3px 9px;border-radius:10px;font-size:12px}
.controls{display:flex;justify-content:center;gap:10px;padding:12px;background:#131722;border-top:1px solid #1f2330;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.panel{width:min(400px,100%);max-height:100%;display:flex;flex-direction:column;background:#131722;border:1px solid #232734;border-radius:16px;overflow:hidden;animation:tileIn .25s cubic-bezier(.16,1,.3,1)}
.panel-head{padding:14px 16px;font-weight:600;border-bottom:1px solid #1f2330}
.panel-note{padding:8px 16px 0;font-size:12px;color:#8a93a8}
.people{flex:1;min-height:0;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.person{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:#0c0f16;cursor:pointer;font-size:14px}
.person:hover{background:#171b26}
.person input{width:16px;height:16px;accent-color:#7c8cff;cursor:pointer}
.pdot{width:8px;height:8px;border-radius:50%;background:#4b5263;flex:none}
.pdot.on{background:#3ddc97;box-shadow:0 0 6px #3ddc97}
.person .pname{flex:1}
.person .plabel{font-size:11px;color:#6b7389}
.panel-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px;border-top:1px solid #1f2330}
.empty{color:#6b7389;font-size:13px;padding:10px 4px}
.cam-req{margin:10px 14px 0;padding:10px 12px;border-radius:12px;background:#1c2130;border:1px solid #2a3040;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;animation:tileIn .3s cubic-bezier(.16,1,.3,1)}
.cam-req .txt{flex:1;min-width:180px;line-height:1.4}
.cam-req button{height:32px;padding:0 12px;font-size:12px}
.captions{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);width:min(720px,92%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:4}
.cap{background:rgba(0,0,0,.72);color:#fff;padding:6px 12px;border-radius:10px;font-size:15px;line-height:1.35;max-width:100%;animation:capIn .25s cubic-bezier(.16,1,.3,1)}
.cap b{color:#a9b4ff;font-weight:600}
@keyframes capIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#toggleCap.off{background:#263055;border-color:#3d4a7a}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">Video call</div>
    <div class="count" id="count"></div>
    <div class="status" id="status"></div>
  </header>
  <div class="error" id="error" hidden></div>
  <div class="cam-req" id="camReq" hidden>
    <span class="txt" id="camReqText"></span>
    <button id="camReqNo">Not now</button>
    <button class="primary" id="camReqYes">Yes</button>
  </div>

  <section class="lobby" id="lobby">
    <h2>Join the video call</h2>
    <p>Your camera and microphone only turn on after you press Join and allow access in the browser. Everyone in the call can see and hear you until you press Leave.</p>
    <p id="who"></p>
    <div class="controls" style="background:none;border:0;padding:0">
      <button class="primary" id="join">Join with camera</button>
      <button id="inviteBtn">Invite people</button>
    </div>
  </section>

  <section class="call" id="call" hidden>
    <div class="grid" id="grid"></div>
    <div class="captions" id="captions"></div>
    <div class="controls">
      <button id="toggleMic">Mute</button>
      <button id="toggleCam">Camera off</button>
      <button id="toggleCap">Captions off</button>
      <button id="inviteCallBtn">Invite people</button>
      <button class="danger" id="leave">Leave</button>
    </div>
  </section>
  <div class="overlay" id="invitePanel" hidden>
    <div class="panel">
      <div class="panel-head">Invite people to the video call</div>
      <div class="panel-note" id="inviteNote">Choose who to invite. They get a notification in the Chromebook.</div>
      <div class="people" id="people"></div>
      <div class="panel-foot">
        <button id="inviteCancel">Cancel</button>
        <button class="primary" id="inviteSend">Send invite</button>
      </div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const VID = Math.random().toString(36).slice(2) + Date.now().toString(36);
let ME = null;
const ICE = [{ urls: 'stun:stun.l.google.com:19302' }];
const peers = new Map();   // vid -> { pc, pending: [] }
const names = new Map();   // vid -> name
let stream = null;
let joined = false;
let micOn = true;
let camOn = true;

function showError(msg) {
  const e = $('#error');
  e.textContent = msg;
  e.hidden = !msg;
}
function setStatus(t) { $('#status').textContent = t; }
function updateCount() { $('#count').textContent = joined ? (1 + names.size) + ' in call' : ''; }

async function post(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  return r.json().catch(() => ({ ok: false, error: 'Unexpected response from the server' }));
}
function sendSignal(to, kind, data) {
  return post('/video/signal', { to: to, from: VID, kind: kind, data: data }).catch(() => {});
}

function addTile(id, name, s, self) {
  if (document.getElementById('tile-' + id)) return;
  const tile = document.createElement('div');
  tile.className = 'tile' + (self ? ' self' : '');
  tile.id = 'tile-' + id;
  const v = document.createElement('video');
  v.autoplay = true;
  v.playsInline = true;
  v.muted = self;
  v.srcObject = s;
  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = (name || '?').charAt(0).toUpperCase();
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = self ? 'You' : name;
  tile.append(v, av, label);
  $('#grid').append(tile);
}
function removeTile(id) {
  const t = document.getElementById('tile-' + id);
  if (t) t.remove();
}

function makePeer(id, name) {
  const pc = new RTCPeerConnection({ iceServers: ICE });
  const peer = { pc: pc, pending: [] };
  peers.set(id, peer);
  names.set(id, name);
  stream.getTracks().forEach(t => pc.addTrack(t, stream));
  pc.onicecandidate = e => { if (e.candidate) sendSignal(id, 'ice', e.candidate); };
  pc.ontrack = e => {
    const s = e.streams[0] || new MediaStream([e.track]);
    const tile = document.getElementById('tile-' + id);
    if (!tile) addTile(id, names.get(id) || 'Guest', s, false);
    else tile.querySelector('video').srcObject = s;
  };
  updateCount();
  return peer;
}

function removePeer(id) {
  const p = peers.get(id);
  if (p) { try { p.pc.close(); } catch (e) {} }
  peers.delete(id);
  names.delete(id);
  removeTile(id);
  updateCount();
}

// The person who joins makes the offers to everyone already in the call
async function callPeer(id, name) {
  const peer = makePeer(id, name);
  const offer = await peer.pc.createOffer();
  await peer.pc.setLocalDescription(offer);
  sendSignal(id, 'offer', peer.pc.localDescription);
}

async function flushPending(peer) {
  for (const c of peer.pending) await peer.pc.addIceCandidate(c).catch(() => {});
  peer.pending = [];
}

async function onSignal(msg) {
  if (!joined || msg.to !== VID) return;
  const from = msg.from;
  try {
    if (msg.kind === 'offer') {
      if (peers.has(from)) removePeer(from);
      const peer = makePeer(from, names.get(from) || 'Guest');
      await peer.pc.setRemoteDescription(msg.data);
      await flushPending(peer);
      const answer = await peer.pc.createAnswer();
      await peer.pc.setLocalDescription(answer);
      sendSignal(from, 'answer', peer.pc.localDescription);
    } else if (msg.kind === 'answer') {
      const peer = peers.get(from);
      if (!peer) return;
      await peer.pc.setRemoteDescription(msg.data);
      await flushPending(peer);
    } else if (msg.kind === 'ice') {
      const peer = peers.get(from);
      if (!peer) return;
      if (peer.pc.remoteDescription) await peer.pc.addIceCandidate(msg.data).catch(() => {});
      else peer.pending.push(msg.data);
    }
  } catch (err) {
    console.error('Signal error', err);
  }
}

async function join() {
  showError('');
  const name = ME ? ME.name : 'Guest';
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  } catch (err) {
    if (err.name === 'NotAllowedError' || err.name === 'SecurityError') {
      showError('Camera or microphone access was blocked. Allow it in the browser and try again.');
    } else if (err.name === 'NotFoundError' || err.name === 'OverconstrainedError') {
      showError('No camera or microphone was found on this device.');
    } else {
      showError('Could not start the camera: ' + err.message);
    }
    return;
  }
  let r;
  try {
    r = await post('/video/join', { vid: VID });
  } catch (err) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
    showError('Could not reach the server. Check your connection.');
    return;
  }
  if (!r.ok) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
    showError(r.error || 'Could not join the call.');
    return;
  }
  joined = true;
  $('#lobby').hidden = true;
  $('#call').hidden = false;
  addTile(VID, name, stream, true);
  setStatus('Connected');
  r.peers.forEach(p => names.set(p.vid, p.name));
  for (const p of r.peers) callPeer(p.vid, p.name);
  updateCount();
}

async function leave() {
  if (!joined) return;
  joined = false;
  try { await post('/video/leave', { vid: VID }); } catch (e) {}
  peers.forEach((p, id) => { try { p.pc.close(); } catch (e) {} removeTile(id); });
  peers.clear();
  names.clear();
  removeTile(VID);
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  micOn = true;
  camOn = true;
  $('#toggleMic').textContent = 'Mute';
  $('#toggleCam').textContent = 'Camera off';
  $('#toggleMic').classList.remove('off');
  $('#toggleCam').classList.remove('off');
  stopCaptions();
  $('#call').hidden = true;
  $('#lobby').hidden = false;
  setStatus('');
  updateCount();
}

function toggleMic() {
  if (!stream) return;
  const t = stream.getAudioTracks()[0];
  if (!t) return;
  micOn = !micOn;
  t.enabled = micOn;
  $('#toggleMic').textContent = micOn ? 'Mute' : 'Unmute';
  $('#toggleMic').classList.toggle('off', !micOn);
  updateCaptions();
}

function toggleCam() {
  if (!stream) return;
  const t = stream.getVideoTracks()[0];
  if (!t) return;
  camOn = !camOn;
  t.enabled = camOn;
  $('#toggleCam').textContent = camOn ? 'Camera off' : 'Camera on';
  $('#toggleCam').classList.toggle('off', !camOn);
  const selfTile = document.getElementById('tile-' + VID);
  if (selfTile) selfTile.classList.toggle('camoff', !camOn);
}

// Live updates from the server
const es = new EventSource('/events');
es.addEventListener('vjoin', e => {
  const d = JSON.parse(e.data);
  if (d.vid === VID) return;
  names.set(d.vid, d.name);
  updateCount();
});
es.addEventListener('vleave', e => {
  const d = JSON.parse(e.data);
  if (d.vid !== VID) removePeer(d.vid);
});
es.addEventListener('vsignal', e => onSignal(JSON.parse(e.data)));

es.addEventListener('camrequest', e => showCamRequest(JSON.parse(e.data)));

// Support can ask you to change your camera. You decide, nothing changes on its own.
let pendingCamAction = null;
function showCamRequest(req) {
  if (!joined) return;
  pendingCamAction = req.action;
  $('#camReqText').textContent = req.action === 'off'
    ? 'Support asks you to turn your camera off.'
    : 'Support asks you to turn your camera on.';
  $('#camReqYes').textContent = req.action === 'off' ? 'Turn camera off' : 'Turn camera on';
  $('#camReq').hidden = false;
}
$('#camReqNo').addEventListener('click', () => { $('#camReq').hidden = true; pendingCamAction = null; });
$('#camReqYes').addEventListener('click', () => {
  if (pendingCamAction === 'off' && camOn) toggleCam();
  if (pendingCamAction === 'on' && !camOn) toggleCam();
  $('#camReq').hidden = true;
  pendingCamAction = null;
});

// Captions: each person's browser turns their own speech into text, and the server shares it with the call.
// Chrome's speech recognition sends the audio to Google to do this.
let captionsOn = false;
let recog = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function setCaptionBtn() {
  const b = $('#toggleCap');
  b.textContent = captionsOn ? 'Captions on' : 'Captions off';
  b.classList.toggle('off', captionsOn);
  b.disabled = !SR;
  b.title = SR ? '' : 'Captions need Chrome';
}

function updateCaptions() {
  if (captionsOn && joined && micOn) startCaptions();
  else stopCaptions();
}

function startCaptions() {
  if (!SR || recog) return;
  const r = new SR();
  r.continuous = true;
  r.interimResults = false;
  r.lang = navigator.language || 'en-US';
  r.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        const text = e.results[i][0].transcript.trim();
        if (text) post('/video/caption', { vid: VID, text: text }).catch(() => {});
      }
    }
  };
  r.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      captionsOn = false;
      setCaptionBtn();
      showError('Captions need microphone access in the browser.');
    }
  };
  r.onend = () => {
    if (recog === r) recog = null;
    if (captionsOn && joined && micOn) startCaptions();
  };
  recog = r;
  try { r.start(); } catch (e) { recog = null; }
}

function stopCaptions() {
  const r = recog;
  recog = null;
  if (r) {
    r.onend = null;
    try { r.stop(); } catch (e) {}
  }
}

function addCaption(name, text) {
  const box = $('#captions');
  const line = document.createElement('div');
  line.className = 'cap';
  const who = document.createElement('b');
  who.textContent = name + ': ';
  line.append(who, document.createTextNode(text));
  box.append(line);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => line.remove(), 9000);
}

es.addEventListener('vcaption', e => {
  if (!joined) return;
  const d = JSON.parse(e.data);
  addCaption(d.name, d.text);
});

$('#toggleCap').addEventListener('click', () => {
  captionsOn = !captionsOn;
  setCaptionBtn();
  updateCaptions();
});
setCaptionBtn();

// Let the others know if this tab closes
window.addEventListener('pagehide', () => {
  if (joined && navigator.sendBeacon) {
    navigator.sendBeacon('/video/leave', new Blob([JSON.stringify({ vid: VID })], { type: 'application/json' }));
  }
});

// Invite picker
async function openInvite() {
  showError('');
  $('#people').innerHTML = '';
  $('#inviteNote').textContent = 'Choose who to invite. They get a notification in the Chromebook.';
  $('#invitePanel').hidden = false;
  let d = null;
  try { d = await (await fetch('/api/users')).json(); } catch (e) {}
  const list = d && d.users ? d.users : [];
  if (!list.length) {
    $('#people').innerHTML = '<div class="empty">No other accounts yet.</div>';
    return;
  }
  list.forEach(u => {
    const label = document.createElement('label');
    label.className = 'person';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = u.id;
    const dot = document.createElement('span');
    dot.className = 'pdot' + (u.online ? ' on' : '');
    const name = document.createElement('span');
    name.className = 'pname';
    name.textContent = u.name;
    const state = document.createElement('span');
    state.className = 'plabel';
    state.textContent = u.online ? 'online' : 'offline';
    label.append(cb, dot, name, state);
    $('#people').append(label);
  });
}

async function sendInvites() {
  const ids = [...document.querySelectorAll('#people input:checked')].map(cb => cb.value);
  if (!ids.length) return ($('#inviteNote').textContent = 'Pick at least one person.');
  const d = await post('/api/invite', { kind: 'call', to: ids });
  if (!d.ok) return ($('#inviteNote').textContent = d.error || 'Could not send the invite.');
  $('#inviteNote').textContent = 'Invite sent to ' + ids.length + ' ' + (ids.length === 1 ? 'person' : 'people') + '.';
  setTimeout(() => { $('#invitePanel').hidden = true; }, 900);
}

async function init() {
  let d;
  try {
    d = await (await fetch('/api/me')).json();
  } catch (e) {
    showError('Could not reach the server. Check your connection.');
    return;
  }
  if (!d.user) {
    location.href = '/login?next=' + encodeURIComponent('/video');
    return;
  }
  ME = d.user;
  $('#who').textContent = 'Joining as ' + ME.name + '.';
}
$('#inviteBtn').addEventListener('click', openInvite);
$('#inviteCallBtn').addEventListener('click', openInvite);
$('#inviteCancel').addEventListener('click', () => { $('#invitePanel').hidden = true; });
$('#inviteSend').addEventListener('click', sendInvites);
init();
$('#join').addEventListener('click', join);
$('#leave').addEventListener('click', leave);
$('#toggleMic').addEventListener('click', toggleMic);
$('#toggleCam').addEventListener('click', toggleCam);
</script>
</body>
</html>
