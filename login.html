<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocalChat · Sign in</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#0b0d12;color:#e7e9f0;font-family:"Google Sans",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(380px,100%);background:#0f1117;border:1px solid #232734;border-radius:18px;padding:28px 26px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:popIn .35s cubic-bezier(.16,1,.3,1)}
@keyframes popIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;margin-bottom:18px}
.logo{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#7c8cff,#3ddc97)}
.tabs{display:flex;gap:6px;background:#131722;border-radius:14px;padding:4px;margin-bottom:18px}
.tab{flex:1;height:34px;border-radius:10px;border:0;background:transparent;color:#8a93a8;font:inherit;font-size:13px;cursor:pointer;transition:background .2s,color .2s}
.tab.active{background:#1c2130;color:#e7e9f0}
form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#8a93a8}
input{height:42px;border-radius:12px;border:1px solid #2a3040;background:#0c0f16;color:#e7e9f0;padding:0 14px;font:inherit;font-size:14px;outline:none;transition:border-color .2s}
input:focus{border-color:#7c8cff}
.name-field[hidden]{display:none}
button.submit{height:44px;margin-top:6px;border-radius:22px;border:0;background:linear-gradient(135deg,#7c8cff,#5a6df0);color:#fff;font:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:transform .12s}
button.submit:hover{filter:brightness(1.08)}
button.submit:active{transform:scale(.97)}
button.submit:disabled{opacity:.6;cursor:default}
.error{margin-bottom:12px;padding:9px 12px;border-radius:10px;background:rgba(255,93,108,.12);border:1px solid rgba(255,93,108,.35);color:#ff9aa4;font-size:13px;line-height:1.4}
.error[hidden]{display:none}
.note{margin-top:16px;font-size:12px;color:#6b7389;line-height:1.5}
[hidden]{display:none !important}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="logo"></span>LocalChat</div>
  <div class="tabs">
    <button class="tab active" id="tabIn" type="button">Sign in</button>
    <button class="tab" id="tabUp" type="button">Create account</button>
  </div>
  <div class="error" id="error" hidden></div>
  <form id="form">
    <label>Email
      <input id="email" type="email" autocomplete="email" required>
    </label>
    <label>Password
      <input id="password" type="password" autocomplete="current-password" minlength="8" required>
    </label>
    <label class="name-field" id="nameField" hidden>Name shown in chats
      <input id="name" maxlength="24" autocomplete="nickname">
    </label>
    <button class="submit" id="submit" type="submit">Sign in</button>
  </form>
  <p class="note" id="hint">Your name stays with your account, so you don't need to enter it again.</p>
</div>

<script>
const params = new URLSearchParams(location.search);
let next = params.get('next') || '/';
if (!next.startsWith('/') || next.startsWith('//')) next = '/';

let mode = 'in';
const $ = s => document.querySelector(s);

function setMode(m) {
  mode = m;
  $('#tabIn').classList.toggle('active', m === 'in');
  $('#tabUp').classList.toggle('active', m === 'up');
  $('#nameField').hidden = m !== 'up';
  $('#name').required = m === 'up';
  $('#password').autocomplete = m === 'up' ? 'new-password' : 'current-password';
  $('#submit').textContent = m === 'up' ? 'Create account' : 'Sign in';
  $('#hint').textContent = m === 'up'
    ? 'Choose a name that other people will see. It stays with your account.'
    : 'Sign in to chat and join video calls.';
  showError('');
}

function showError(msg) {
  const e = $('#error');
  e.textContent = msg;
  e.hidden = !msg;
}

$('#tabIn').addEventListener('click', () => setMode('in'));
$('#tabUp').addEventListener('click', () => setMode('up'));

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  showError('');
  const btn = $('#submit');
  btn.disabled = true;
  const body = { email: $('#email').value, password: $('#password').value };
  if (mode === 'up') body.name = $('#name').value;
  try {
    const r = await fetch(mode === 'up' ? '/api/signup' : '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const d = await r.json().catch(() => ({ ok: false, error: 'Unexpected response from the server.' }));
    if (!d.ok) throw new Error(d.error || 'Something went wrong.');
    location.href = next;
  } catch (err) {
    showError(err instanceof TypeError ? 'Could not reach the server. Check your connection.' : err.message);
    btn.disabled = false;
  }
});

setMode('in');
</script>
</body>
</html>
